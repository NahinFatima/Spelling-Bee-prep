<title>Monkey Police Academy</title>

<style>
/* Layout: one narrow column. Header with monkey and speech bubble, then either the case board, one case (six steps in one stage card), or the grown-up page. */
:root {
  --bg: #f3edff;
  --surface: #ffffff;
  --paper: #fffdf7;
  --ink: #26134a;
  --ink-soft: #5d4a85;
  --purple: #6d2fd6;
  --purple-deep: #3b1485;
  --on-purple: #ffffff;
  --lav: #e5d9ff;
  --line: #cdbbf2;
  --gold: #ffc21a;
  --gold-deep: #c98f00;
  --gold-ink: #3a2a00;
  --focus: #b86e00;
  --guide-line: rgba(109, 47, 214, 0.75);
  --guide-done: rgba(31, 157, 98, 0.85);
  --stroke: #6d2fd6;
  --demo: #e08a00;
  --road: #6a5a96;
  --lane: #efe7ff;
  --sky: #dccbff;
  --carbody: #7a3fe0;
  --glass: #cfe6ff;
  --monkey: #8a5a3c;
  --monkey-light: #ecc9a3;
  --cap: #4b1fa8;
  --cap-brim: #2b1060;
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --text: 'Andika', 'Trebuchet MS', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150a2e; --surface: #241346; --paper: #2a1853; --ink: #f3ecff; --ink-soft: #bda9ec;
    --purple: #a57bff; --purple-deep: #5b34b0; --on-purple: #1a0b3b; --lav: #33205f; --line: #4a3380;
    --focus: #ffc21a; --guide-line: rgba(200, 175, 255, 0.8); --guide-done: rgba(70, 210, 140, 0.9);
    --stroke: #ffc21a; --demo: #ff9de2; --road: #1b0f38; --lane: #6b57a8; --sky: #2c1a57; --carbody: #9a6dff;
    --cap: #7a45e0; --cap-brim: #4a2899;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150a2e; --surface: #241346; --paper: #2a1853; --ink: #f3ecff; --ink-soft: #bda9ec;
  --purple: #a57bff; --purple-deep: #5b34b0; --on-purple: #1a0b3b; --lav: #33205f; --line: #4a3380;
  --focus: #ffc21a; --guide-line: rgba(200, 175, 255, 0.8); --guide-done: rgba(70, 210, 140, 0.9);
  --stroke: #ffc21a; --demo: #ff9de2; --road: #1b0f38; --lane: #6b57a8; --sky: #2c1a57; --carbody: #9a6dff;
  --cap: #7a45e0; --cap-brim: #4a2899;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--text); font-size: 17px; line-height: 1.5;
  padding-block: 12px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

/* header */
.brandrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.15rem; letter-spacing: 0.02em; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { font-family: var(--display); font-weight: 600; font-size: 0.9rem; background: var(--gold); color: var(--gold-ink); padding: 5px 12px; border-radius: 99px; }
.icon-btn { font: 600 0.85rem var(--display); background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 99px; padding: 5px 12px; cursor: pointer; min-height: 34px; }
.hero { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; margin-top: 10px; }
.monkey { width: 96px; animation: bob 3.2s ease-in-out infinite; }
.monkey svg { width: 100%; height: auto; display: block; }
.monkey.cheer { animation: cheer 0.9s ease-in-out; }
.bubble { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 12px 16px; font-weight: 700; font-size: 1.05rem; }
.bubble::before { content: ""; position: absolute; left: -10px; top: 50%; width: 16px; height: 16px; background: var(--surface); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: translateY(-50%) rotate(45deg); }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes cheer { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-9deg) translateY(-8px); } 75% { transform: rotate(9deg) translateY(-8px); } }

/* buttons */
.btn { font: 600 1.05rem var(--display); min-height: 56px; padding: 0 22px; border-radius: 18px; border: 0; background: var(--purple); color: var(--on-purple); box-shadow: 0 5px 0 var(--purple-deep); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: transform 0.08s, box-shadow 0.08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--purple-deep); }
.btn.gold { background: var(--gold); color: var(--gold-ink); box-shadow: 0 5px 0 var(--gold-deep); }
.btn.gold:active { box-shadow: 0 2px 0 var(--gold-deep); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn.small { min-height: 44px; padding: 0 16px; font-size: 0.95rem; }
.btn.big { min-height: 68px; font-size: 1.3rem; padding: 0 30px; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btnrow { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.topbar { display: flex; align-items: center; gap: 10px; }
.topbar h2 { flex: 1; font-size: 1.35rem; }
.back { font: 600 0.95rem var(--display); text-decoration: none; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 8px 14px; }

/* cards */
.card { position: relative; background: var(--surface); border: 2px solid var(--line); border-radius: 24px; padding: 16px; display: grid; gap: 14px; }
.hint { color: var(--ink-soft); font-size: 0.92rem; }
.center { text-align: center; }
.cta { display: grid; gap: 10px; justify-items: start; background: var(--purple); color: var(--on-purple); border-radius: 24px; padding: 18px; }
.cta h2 { font-size: 1.4rem; }
.cta .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.cta .pic { font-size: 3.6rem; line-height: 1; }
.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.casecard { display: grid; justify-items: center; gap: 4px; text-align: center; text-decoration: none; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 12px 6px; }
.casecard .pic { font-size: 2.6rem; line-height: 1.1; }
.casecard b { font-family: var(--text); font-size: 1rem; }
.pips { display: flex; gap: 4px; }
.pips i { width: 10px; height: 10px; border-radius: 50%; background: var(--lav); border: 2px solid var(--line); }
.pips i.on { background: var(--gold); border-color: var(--gold-deep); }
.ranks { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; }

/* case steps */
.steps { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.step { position: relative; min-height: 38px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: 600 0.85rem var(--display); cursor: pointer; }
.step.on { background: var(--purple); color: var(--on-purple); border-color: var(--purple-deep); }
.step.ok::after { content: "\2605"; position: absolute; top: -9px; right: -6px; color: var(--gold); font-size: 0.95rem; text-shadow: 0 1px 0 var(--gold-ink); }
.picbox { display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 132px; }
.bigpic { font-size: 5rem; line-height: 1.05; }
.bigpic.pop, .sl.pop { animation: pop2 0.5s; }
.wordtxt { font: 700 2.4rem var(--text); letter-spacing: 0.1em; min-height: 1.3em; }
@keyframes pop2 { 0% { transform: scale(0.4); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.spell { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.sl { width: 56px; height: 70px; border-bottom: 5px solid var(--line); display: grid; place-items: center; font: 700 2.8rem var(--text); }
.track { --cw: 90px; position: relative; overflow: hidden; height: calc(var(--cw) * 1.15 + 34px); border-radius: 20px; background: linear-gradient(var(--sky) 0 62%, var(--road) 62% 100%); }
.track .lane { position: absolute; left: 0; right: 0; bottom: 6px; height: 4px; background: repeating-linear-gradient(90deg, var(--lane) 0 22px, transparent 22px 40px); }
.track .car { position: absolute; left: 0; bottom: 12px; }
.car { --cw: 90px; width: var(--cw); display: flex; flex-direction: column; align-items: stretch; will-change: transform; }
.car svg { width: 100%; height: auto; display: block; }
.plate { margin: 0 auto 3px; min-width: 62%; background: var(--surface); color: var(--ink); border: 3px solid var(--purple-deep); border-radius: 12px; display: flex; align-items: baseline; justify-content: center; gap: 4px; line-height: 1; padding: 3px 6px; font-family: var(--text); }
.plate b { font-size: calc(var(--cw) * 0.4); }
.plate i { font-style: normal; font-size: calc(var(--cw) * 0.2); color: var(--ink-soft); }
.plate .em { font-size: calc(var(--cw) * 0.36); }
.sir { fill: #888; opacity: 0.4; }
.car.flash .sir.a { fill: #ff3b30; animation: sa 0.5s steps(1) infinite; }
.car.flash .sir.b { fill: #2d7bff; animation: sb 0.5s steps(1) infinite; }
@keyframes sa { 0% { opacity: 1; } 50% { opacity: 0.15; } }
@keyframes sb { 0% { opacity: 0.15; } 50% { opacity: 1; } }
.lot { --cw: 90px; display: flex; flex-wrap: wrap; justify-content: center; gap: 16px 14px; padding: 14px 8px 10px; border-radius: 20px; background: linear-gradient(var(--sky) 0 70%, var(--road) 70% 100%); }
.carbtn { background: none; border: 0; padding: 0; cursor: pointer; border-radius: 14px; }
.carbtn .car { position: relative; }
.carbtn.hintme .car { animation: nudge 0.7s ease-in-out infinite alternate; }
@keyframes nudge { to { transform: translateY(-8px); } }
.wob { animation: wob 0.35s; }
@keyframes wob { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-9px); } 75% { transform: translateX(9px); } }
.orbhost { display: grid; justify-items: center; }
.orb { position: relative; margin: 0 auto; border-radius: 50%; background: var(--paper); border: 5px solid var(--purple); box-shadow: 0 0 0 7px var(--lav); overflow: hidden; }
.orb canvas { display: block; touch-action: none; }
.orb.final { display: grid; place-items: center; align-content: center; text-align: center; }
.orb.final .bigpic { font-size: 4.4rem; }
.mic { width: 124px; height: 124px; border-radius: 50%; border: 0; background: var(--purple); color: var(--on-purple); box-shadow: 0 6px 0 var(--purple-deep); font: 700 1.1rem var(--display); cursor: pointer; display: grid; place-items: center; align-content: center; gap: 2px; justify-self: center; }
.mic .ico { font-size: 2.4rem; line-height: 1; }
.mic.live { animation: pulse 0.9s ease-in-out infinite alternate; background: var(--gold); color: var(--gold-ink); box-shadow: 0 6px 0 var(--gold-deep); }
@keyframes pulse { to { transform: scale(1.1); } }
.status { text-align: center; min-height: 1.5em; font-weight: 700; }
.stamp { position: absolute; left: 50%; top: 45%; z-index: 5; pointer-events: none; transform: translate(-50%, -50%) rotate(-8deg); background: var(--gold); color: var(--gold-ink); border: 4px solid var(--gold-ink); border-radius: 14px; padding: 10px 22px; font: 700 clamp(1.4rem, 6.5vw, 2.2rem) var(--display); white-space: nowrap; animation: pop 1.8s forwards; }
@keyframes pop { 0% { transform: translate(-50%, -50%) rotate(-8deg) scale(2.3); opacity: 0; } 14% { transform: translate(-50%, -50%) rotate(-8deg) scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-50%, -50%) rotate(-8deg) scale(1); opacity: 0; } }
.dots { display: flex; gap: 8px; justify-content: center; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--lav); border: 2px solid var(--line); }
.dots i.on { background: var(--gold); border-color: var(--gold-deep); }

/* grown-up page */
.mom h3 { font-size: 1.2rem; }
.plan { background: var(--lav); border-radius: 18px; padding: 14px 16px; display: grid; gap: 6px; }
.plan strong { font: 600 1.1rem var(--display); }
.checks { display: grid; gap: 4px; }
.checks label { display: flex; gap: 12px; align-items: center; min-height: 46px; cursor: pointer; }
.checks input { width: 24px; height: 24px; accent-color: var(--purple); flex: none; }
ol.routine, ul.tips { margin: 0; padding-left: 1.2rem; display: grid; gap: 8px; }
ol.routine li::marker { color: var(--purple); font-weight: 700; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 700; }
.field input, .field textarea { font: 400 1rem var(--text); color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; width: 100%; }
.msg { font-size: 0.92rem; color: var(--ink-soft); min-height: 1.4em; }

@media (max-width: 420px) {
  .hero { grid-template-columns: 80px minmax(0, 1fr); }
  .monkey { width: 80px; }
  .sl { width: 46px; height: 60px; font-size: 2.3rem; }
}
@media (prefers-reduced-motion: reduce) {
  .monkey, .car.flash .sir, .carbtn.hintme .car, .mic.live { animation: none !important; }
}
</style>

</div>

        if (!resetArmed) { resetArmed = true; t.textContent = 'Tap again to erase all badges'; return; }
        state.done = {}; save(); resetArmed = false; render(); updateHeader();
      }
    };
    render();
  };

  /* ---------- router ---------- */
  function route() {
    if (cleanup) { cleanup(); cleanup = null; }
    seq++;
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
    actions = {};
    var h = (location.hash || '#home').slice(1), name = 'home', arg = null, m = /^case-([a-z]+)$/.exec(h);
    if (m && state.words.indexOf(m[1]) >= 0) { name = 'case'; arg = m[1]; }
    else if (h === 'mom') name = 'mom';
    view.innerHTML = '';
    updateHeader();
    cleanup = VIEWS[name](arg) || null;
    window.scrollTo(0, 0);
  }
  view.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t || t.tagName === 'INPUT') return;
    if (actions[t.dataset.act]) actions[t.dataset.act](t);
  });
  view.addEventListener('change', function (e) {
    var t = e.target;
    if (t.tagName === 'INPUT' && t.dataset.act === 'check' && actions.check) actions.check(t);
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body></html>
